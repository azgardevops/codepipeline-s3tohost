<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allah's-world - Automated AWS Deployment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to Allah's world</h1>
        <p>Version 1.0 - Deployed automatically via AWS CodePipeline!</p>
        <button onclick="showMessage()">Test Interaction</button>
        <p id="status"></p>
    </div>
    <script>
        function showMessage() {
            document.getElementById("status").innerText = "CI/CD Pipeline is working smoothly!";
        }
    </script>
</body>
</html>
